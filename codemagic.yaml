workflows:
  lockin-ios-release:
    name: LockIn — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 27.1
      groups:
        - LockIn

    scripts:
      - name: Bygg och distribuera
        script: |
          set -e

          # ── .NET ───────────────────────────────────────────────
          # SDK och workload-set är låsta: varje .NET for iOS-release kräver en
          # exakt Xcode-version. Workload-set 10.0.402.1 = .NET for iOS 27.1.10018
          # + MAUI 10.0.110, som kräver Xcode 27.1 och UIScene-livscykeln
          # (Platforms/iOS/SceneDelegate.cs). Byt alla tre tillsammans.
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --version 10.0.402
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version
          dotnet workload install maui-ios --version 10.0.402.1
          dotnet workload --info

          # ── Keychain ───────────────────────────────────────────
          KEYCHAIN_PATH=/tmp/build.keychain
          security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # ── Provisioning-profil ────────────────────────────────
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          PROV_NAME=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract Name raw -)
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Installerade profil: $PROV_NAME ($UUID)"

          # ── Bygg ───────────────────────────────────────────────
          dotnet publish LockIn/LockIn.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            /p:ArchiveOnBuild=true \
            /p:CodesignProvision="$PROV_NAME" \
            /p:CodesignKey="Apple Distribution"

          # ── TestFlight-upload ──────────────────────────────────
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8

          IPA=$(find LockIn/bin -name "*.ipa" 2>/dev/null | head -1)
          [ -z "$IPA" ] && echo "ERROR: ingen IPA hittades i LockIn/bin" && exit 1
          xcrun --find altool 2>/dev/null || (echo "ERROR: xcrun altool saknas i $(xcodebuild -version | head -1) — uppgradera CI-konfigurationen" && exit 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

    artifacts:
      - '**/*.ipa'
